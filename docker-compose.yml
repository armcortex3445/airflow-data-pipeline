# Airflow 2 학습용 docker compose (LocalExecutor + PostgreSQL)
# 사용법: ./build.sh up
x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-airflow-study:2.10.5}
  build:
    context: ./docker
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.10.5}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Seoul
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 10
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    # DAG 에서 conn_id="my_postgres" 로 참조하는 연결. 대상 DB 는 메타데이터 DB 와 같고 테이블은 dag_data 스키마를 쓴다
    AIRFLOW_CONN_MY_POSTGRES: postgresql://airflow:airflow@postgres:5432/airflow
  volumes:
    # 프로젝트 루트를 dags 폴더로 마운트 → ch2/, ch4/ 등 챕터별 DAG 를 그대로 인식
    - .:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      # 빈 볼륨으로 최초 기동할 때만 실행되는 초기화 SQL (dag_data 스키마/테이블)
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # DB 마이그레이션 + 관리자 계정 생성.
  # 공식 entrypoint(/entrypoint) 를 거쳐야 임의 UID 로 실행돼도 사용자 항목이 만들어진다.
  # 초기화 작업은 entrypoint 가 _AIRFLOW_DB_MIGRATE / _AIRFLOW_WWW_USER_CREATE 를 보고 수행한다.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
